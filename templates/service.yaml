apiVersion: v1
kind: Service
metadata:
    name: frontend
    namespace: roboshop-dev
    labels:
        project: roboshop
        tier: frontend
        service: frontend
spec:
    type: ClusterIP
    selector:
        project: roboshop
        tier: frontend
        service: frontend
    ports:
      - protocol: TCP
        port: 80
        targetPort: 8080